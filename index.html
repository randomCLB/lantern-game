<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 天文地理知识挑战赛 🌍</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(180deg, #0a0a1a 0%, #1a1a3e 50%, #0d1b2a 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        #gameContainer {
            position: relative;
            width: 100%;
            min-height: 100vh;
        }
        
        /* 顶部信息栏 */
        #topBar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            border-bottom: 2px solid #4a9eff;
        }
        
        .stat {
            color: #4a9eff;
            font-size: 18px;
            font-weight: bold;
        }
        
        .stat span {
            color: #fff;
            margin-left: 5px;
        }
        
        /* 开始界面 */
        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        
        #startScreen h1 {
            color: #4a9eff;
            font-size: 42px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #4a9eff;
            animation: glow 2s ease-in-out infinite;
            text-align: center;
        }
        
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 20px #4a9eff, 0 0 40px #6b5ce7; }
            50% { text-shadow: 0 0 30px #4a9eff, 0 0 60px #6b5ce7; }
        }
        
        #startScreen p {
            color: #fff;
            font-size: 18px;
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.8;
            max-width: 500px;
            padding: 0 20px;
        }
        
        .btn {
            padding: 15px 50px;
            font-size: 24px;
            background: linear-gradient(45deg, #4a9eff, #6b5ce7);
            border: none;
            border-radius: 50px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(74,158,255,0.4);
        }
        
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(74,158,255,0.6);
        }
        
        /* 红包 */
        .hongbao-wrapper {
            position: absolute;
            width: 100px;
            height: 120px;
            cursor: pointer;
            z-index: 100;
            animation: fall linear;
        }
        
        .hongbao {
            width: 60px;
            height: 80px;
            background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            box-shadow: 0 5px 15px rgba(255,0,0,0.4);
            margin: 20px auto;
        }
        
        .hongbao::before {
            content: "🧧";
        }
        
        .hongbao-wrapper.gold .hongbao {
            background: linear-gradient(135deg, #ffd700 0%, #ffaa00 100%);
            box-shadow: 0 5px 15px rgba(255,215,0,0.6);
        }
        
        @keyframes fall {
            from { transform: translateY(-150px) rotate(0deg); }
            to { transform: translateY(100vh) rotate(360deg); }
        }
        
        /* 答题界面 */
        #quizScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10,10,26,0.95);
            z-index: 1500;
            padding: 100px 20px 20px;
        }
        
        #quizCard {
            max-width: 650px;
            margin: 0 auto;
            background: linear-gradient(135deg, #1a1a3e 0%, #0d1b2a 100%);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 40px rgba(74,158,255,0.2);
            border: 2px solid #4a9eff;
        }
        
        #quizNumber {
            color: #4a9eff;
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
        }
        
        #answerType {
            display: inline-block;
            background: linear-gradient(45deg, #6b5ce7, #4a9eff);
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 16px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        
        #quizText {
            color: #fff;
            font-size: 24px;
            line-height: 1.6;
            margin-bottom: 20px;
            text-align: center;
            min-height: 80px;
        }
        
        #timerBar {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        #timerProgress {
            height: 100%;
            background: linear-gradient(90deg, #00aa00, #4a9eff, #ff4444);
            width: 100%;
            transition: width 0.1s linear;
        }
        
        #answerInput {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            background: rgba(255,255,255,0.1);
            border: 2px solid #4a9eff;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
            color: #fff;
        }
        
        #answerInput::placeholder {
            color: #888;
        }
        
        #submitAnswer {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            background: linear-gradient(45deg, #4a9eff, #6b5ce7);
            border: none;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        #submitAnswer:hover {
            transform: scale(1.02);
        }
        
        #quizResult {
            margin-top: 15px;
            font-size: 20px;
            text-align: center;
            min-height: 60px;
        }
        
        /* 引导提示 - 醒目但不直白 */
        #hintBox {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: linear-gradient(135deg, rgba(107,92,231,0.3), rgba(74,158,255,0.3));
            border: 2px solid #6b5ce7;
            border-radius: 10px;
            text-align: center;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 10px rgba(107,92,231,0.5); }
            50% { box-shadow: 0 0 20px rgba(107,92,231,0.8); }
        }
        
        #hintLabel {
            color: #ffd700;
            font-size: 14px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        #hintText {
            color: #fff;
            font-size: 18px;
            font-style: italic;
        }
        
        .correct {
            color: #00ff00;
        }
        
        .wrong {
            color: #ff4444;
        }
        
        .timeout {
            color: #ffaa00;
        }
        
        /* 烟花画布 */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3000;
        }
        
        /* 游戏结束 */
        #gameOver {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10,10,26,0.95);
            z-index: 2000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        #gameOver h2 {
            color: #4a9eff;
            font-size: 48px;
            margin-bottom: 30px;
        }
        
        #finalScore {
            color: #fff;
            font-size: 36px;
            margin-bottom: 20px;
        }
        
        #rank {
            color: #6b5ce7;
            font-size: 28px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        
        #encouragement {
            color: #ffd700;
            font-size: 24px;
            margin-bottom: 40px;
            font-style: italic;
        }
        
        #countdown {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            color: #4a9eff;
            z-index: 2500;
            display: none;
            text-shadow: 0 0 30px #4a9eff;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="topBar">
            <div class="stat">🧧 红包: <span id="hongbaoCount">0</span></div>
            <div class="stat">⏱️ 时间: <span id="timeLeft">30</span>s</div>
            <div class="stat">🎯 得分: <span id="score">0</span></div>
            <div class="stat">🌟 题目: <span id="quizProgress">0/5</span></div>
        </div>
        
        <div id="countdown"></div>
        
        <div id="startScreen">
            <h1>🌟 天文地理知识挑战赛 🌍</h1>
            <p>
                点击掉落的红包，抢得越多越好！<br>
                回答天文地理知识问题，测试你的知识储备！<br>
                <small>题目涵盖太阳系、星座、地理、自然现象等知识</small>
            </p>
            <button class="btn" onclick="startGame()">开始挑战</button>
        </div>
        
        <div id="quizScreen">
            <div id="quizCard">
                <div id="quizNumber">第 1 / 5 题</div>
                <div style="text-align: center;"><span id="answerType">天文·2个字</span></div>
                <div id="timerBar"><div id="timerProgress"></div></div>
                <div id="quizText">加载中...</div>
                <input type="text" id="answerInput" placeholder="请输入答案" maxlength="20">
                <button id="submitAnswer" onclick="checkAnswer()">提交答案</button>
                <div id="quizResult"></div>
                <div id="hintBox">
                    <div id="hintLabel">💡 知识引导</div>
                    <div id="hintText"></div>
                </div>
            </div>
        </div>
        
        <div id="gameOver">
            <h2>🎉 挑战完成 🎉</h2>
            <div id="finalScore"></div>
            <div id="rank"></div>
            <div id="encouragement"></div>
            <button class="btn" onclick="location.reload()">再玩一次</button>
        </div>
        
        <canvas id="fireworksCanvas"></canvas>
    </div>

    <script>
        let gameState = {
            hongbaoCount: 0,
            score: 0,
            timeLeft: 30,
            currentQuiz: 0,
            correctQuizzes: 0,
            isPlaying: false,
            hongbaoInterval: null,
            timerInterval: null,
            quizTimer: null,
            selectedQuizzes: []
        };

        // 100道天文地理知识题
        const quizzes = [
            // 天文类 - 太阳系
            { q: "太阳系中最大的行星是？", a: "木星", type: "天文·2个字", hint: "这颗行星比地球大300多倍，有著名的大红斑" },
            { q: "太阳系中离太阳最近的行星是？", a: "水星", type: "天文·2个字", hint: "中国古代称为'辰星'，公转速度最快" },
            { q: "太阳系中唯一有生命存在的行星是？", a: "地球", type: "天文·2个字", hint: "我们脚下的这颗蓝色星球" },
            { q: "太阳系中被称为'红色星球'的是？", a: "火星", type: "天文·2个字", hint: "因表面氧化铁而呈红色，人类探索的重点目标" },
            { q: "太阳系中拥有最多卫星的行星是？", a: "土星", type: "天文·2个字", hint: "拥有美丽的光环，卫星数量超过80颗" },
            { q: "太阳系中最热的行星是？", a: "金星", type: "天文·2个字", hint: "表面温度可达462°C，比水星还热" },
            { q: "太阳系中最冷的行星是？", a: "海王星", type: "天文·3个字", hint: "距离太阳最远的冰巨星" },
            { q: "太阳系中唯一逆向自转的行星是？", a: "金星", type: "天文·2个字", hint: "太阳从西边升起，东边落下" },
            { q: "太阳系中自转最快的行星是？", a: "木星", type: "天文·2个字", hint: "一天只有约10小时" },
            { q: "太阳系中自转最慢的行星是？", a: "金星", type: "天文·2个字", hint: "一天比一年还长" },
            
            // 天文类 - 恒星与星座
            { q: "距离地球最近的恒星是？", a: "太阳", type: "天文·2个字", hint: "它提供了地球上所有的光和热" },
            { q: "夜空中最亮的恒星是？", a: "天狼星", type: "天文·3个字", hint: "位于大犬座，冬季夜空中最亮" },
            { q: "北斗七星属于哪个星座？", a: "大熊座", type: "天文·3个字", hint: "一个巨大的熊形星座" },
            { q: "北极星属于哪个星座？", a: "小熊座", type: "天文·3个字", hint: "小熊的尾巴尖上" },
            { q: "夏季大三角由哪三颗星组成？（回答最亮的一颗）", a: "织女星", type: "天文·3个字", hint: "牛郎织女故事中的女主角" },
            { q: "猎户座腰带上的三颗星被称为什么？", a: "参宿三星", type: "天文·4个字", hint: "福禄寿三星高照" },
            { q: "银河系大约有多少颗恒星？（回答数量级）", a: "千亿", type: "天文·2个字", hint: "1000亿到4000亿之间" },
            { q: "光从太阳到地球需要多长时间？", a: "8分钟", type: "天文·3个字", hint: "光速约30万公里/秒" },
            { q: "一年中太阳直射点最北到达哪里？", a: "北回归线", type: "地理·4个字", hint: "北纬23.5度" },
            { q: "日食发生时，月亮位于什么位置？", a: "中间", type: "天文·2个字", hint: "太阳、月亮、地球三者的位置关系" },
            
            // 地理类 - 地球与地形
            { q: "地球表面约有多少百分比被水覆盖？", a: "71", type: "地理·数字", hint: "约七成是海洋" },
            { q: "地球上最深的海沟是？", a: "马里亚纳海沟", type: "地理·6个字", hint: "位于太平洋，深度超过11000米" },
            { q: "地球上最高的山峰是？", a: "珠穆朗玛峰", type: "地理·5个字", hint: "海拔8848.86米，位于喜马拉雅山脉" },
            { q: "世界上最大的沙漠是？", a: "撒哈拉沙漠", type: "地理·5个字", hint: "位于非洲北部" },
            { q: "世界上最大的平原是？", a: "亚马逊平原", type: "地理·5个字", hint: "位于南美洲，热带雨林气候" },
            { q: "世界上最大的半岛是？", a: "阿拉伯半岛", type: "地理·5个字", hint: "位于亚洲西南部" },
            { q: "世界上最大的岛屿是？", a: "格陵兰岛", type: "地理·4个字", hint: "位于北美洲东北部，大部分被冰覆盖" },
            { q: "世界上最长的河流是？", a: "尼罗河", type: "地理·3个字", hint: "位于非洲，长约6650公里" },
            { q: "世界上流量最大的河流是？", a: "亚马逊河", type: "地理·4个字", hint: "位于南美洲，流量占全球20%" },
            { q: "世界上最大的淡水湖是？", a: "苏必利尔湖", type: "地理·5个字", hint: "位于北美五大湖区" },
            
            // 地理类 - 国家与城市
            { q: "世界上面积最大的国家是？", a: "俄罗斯", type: "地理·3个字", hint: "横跨欧亚大陆，面积约1700万平方公里" },
            { q: "世界上人口最多的国家是？", a: "印度", type: "地理·2个字", hint: "2023年人口超过中国" },
            { q: "世界上面积最小的国家是？", a: "梵蒂冈", type: "地理·3个字", hint: "位于意大利罗马城内" },
            { q: "世界上最高的首都是？", a: "拉巴斯", type: "地理·3个字", hint: "玻利维亚首都，海拔约3640米" },
            { q: "赤道穿过的非洲国家有哪些？（回答一个）", a: "肯尼亚", type: "地理·3个字", hint: "东非国家，以野生动物闻名" },
            { q: "世界上跨经度最多的国家是？", a: "俄罗斯", type: "地理·3个字", hint: "横跨11个时区" },
            { q: "世界上跨纬度最多的国家是？", a: "中国", type: "地理·2个字", hint: "从热带到寒温带" },
            { q: "地中海沿岸的国家有哪些？（回答一个）", a: "意大利", type: "地理·3个字", hint: "靴子形状的国家" },
            { q: "世界上最北的首都是？", a: "雷克雅未克", type: "地理·5个字", hint: "冰岛首都，靠近北极圈" },
            { q: "世界上最南的首都是？", a: "惠灵顿", type: "地理·3个字", hint: "新西兰首都" },
            
            // 自然现象
            { q: "彩虹的七种颜色按顺序是什么？（回答第一种）", a: "红", type: "自然·1个字", hint: "赤橙黄绿青蓝紫的第一个" },
            { q: "极光通常出现在地球的什么地方？", a: "两极", type: "地理·2个字", hint: "南极和北极地区" },
            { q: "台风和飓风本质上是同一种现象，区别是什么？", a: "地点", type: "地理·2个字", hint: "发生的海域不同" },
            { q: "地球上最大的洋是？", a: "太平洋", type: "地理·3个字", hint: "面积占地球海洋的一半" },
            { q: "地球上最小的大洋是？", a: "北冰洋", type: "地理·3个字", hint: "位于北极地区" },
            { q: "地球上最大的洲是？", a: "亚洲", type: "地理·2个字", hint: "面积约占全球陆地30%" },
            { q: "地球上最小的洲是？", a: "大洋洲", type: "地理·3个字", hint: "澳大利亚所在的大洲" },
            { q: "地球上最长的山脉是？", a: "安第斯山脉", type: "地理·5个字", hint: "位于南美洲，长约8900公里" },
            { q: "地球上最大的峡谷是？", a: "雅鲁藏布大峡谷", type: "地理·7个字", hint: "位于中国西藏" },
            { q: "地球上最大的珊瑚礁系统是？", a: "大堡礁", type: "地理·3个字", hint: "位于澳大利亚东北海岸" },
            
            // 天文进阶
            { q: "黑洞的边界被称为什么？", a: "事件视界", type: "天文·4个字", hint: "光也无法逃逸的边界" },
            { q: "宇宙大爆炸理论认为宇宙起源于多少年前？", a: "138亿年", type: "天文·4个字", hint: "约138亿年前" },
            { q: "月球绕地球公转一周大约需要多少天？", a: "27.3", type: "天文·数字", hint: "约27天半" },
            { q: "地球公转一周形成什么？", a: "一年", type: "天文·2个字", hint: "四季更替的周期" },
            { q: "地球自转一周形成什么？", a: "一天", type: "天文·2个字", hint: "昼夜交替的周期" },
            { q: "春分点和秋分点时，昼夜长短如何？", a: "相等", type: "天文·2个字", hint: "昼夜平分" },
            { q: "夏至时，北半球白天最长还是夜晚最长？", a: "白天", type: "天文·2个字", hint: "北极圈内出现极昼" },
            { q: "冬至时，南半球是什么季节？", a: "夏季", type: "天文·2个字", hint: "南北半球季节相反" },
            { q: "彗星的主要成分是什么？", a: "冰", type: "天文·1个字", hint: "脏雪球理论" },
            { q: "小行星带位于哪两颗行星之间？", a: "火星木星", type: "天文·4个字", hint: "类地行星和巨行星之间" },
            
            // 地理进阶
            { q: "板块构造学说中，地球表层被分成几大板块？", a: "7", type: "地理·数字", hint: "七大板块" },
            { q: "环太平洋地带被称为什么？", a: "火环", type: "地理·2个字", hint: "地震火山多发带" },
            { q: "世界上最活跃的火山是？", a: "埃特纳火山", type: "地理·5个字", hint: "位于意大利西西里岛" },
            { q: "世界上最深的湖泊是？", a: "贝加尔湖", type: "地理·4个字", hint: "位于俄罗斯，最深处1642米" },
            { q: "世界上最大的高原是？", a: "巴西高原", type: "地理·4个字", hint: "位于南美洲" },
            { q: "世界上最大的盆地是？", a: "刚果盆地", type: "地理·4个字", hint: "位于非洲中部" },
            { q: "世界上最大的三角洲是？", a: "恒河三角洲", type: "地理·5个字", hint: "位于孟加拉国和印度" },
            { q: "世界上最大的海峡是？", a: "德雷克海峡", type: "地理·5个字", hint: "位于南美洲和南极洲之间" },
            { q: "世界上最大的海湾是？", a: "孟加拉湾", type: "地理·4个字", hint: "位于印度洋东北部" },
            { q: "世界上最大的内海是？", a: "地中海", type: "地理·3个字", hint: "位于欧洲、非洲、亚洲之间" },
            
            // 中国地理
            { q: "中国最长的河流是？", a: "长江", type: "地理·2个字", hint: "全长约6300公里" },
            { q: "中国第二长河是？", a: "黄河", type: "地理·2个字", hint: "中华民族的母亲河" },
            { q: "中国最大的湖泊是？", a: "青海湖", type: "地理·3个字", hint: "位于青海省，是咸水湖" },
            { q: "中国最大的岛屿是？", a: "台湾岛", type: "地理·3个字", hint: "位于东南沿海" },
            { q: "中国最大的沙漠是？", a: "塔克拉玛干沙漠", type: "地理·7个字", hint: "位于新疆，被称为'死亡之海'" },
            { q: "中国最高的山峰是？", a: "珠穆朗玛峰", type: "地理·5个字", hint: "位于西藏与尼泊尔边境" },
            { q: "中国最大的盆地是？", a: "塔里木盆地", type: "地理·5个字", hint: "位于新疆南部" },
            { q: "中国最大的平原是？", a: "东北平原", type: "地理·4个字", hint: "由三江平原、松嫩平原、辽河平原组成" },
            { q: "中国最大的高原是？", a: "青藏高原", type: "地理·4个字", hint: "世界屋脊" },
            { q: "中国陆地面积最大的省级行政区是？", a: "新疆", type: "地理·2个字", hint: "约占全国陆地面积的1/6" }
        ];

        // 鼓励词
        const encouragements = {
            0: { text: "知识需要积累，再接再厉！", fireworks: 1 },
            1: { text: "不错，至少答对了一题！", fireworks: 2 },
            2: { text: "很好，已经掌握了不少知识！", fireworks: 3 },
            3: { text: "真棒，天文地理小达人！", fireworks: 4 },
            4: { text: "厉害，知识储备很丰富！", fireworks: 5 },
            5: { text: "🏆 完美！天文地理大师！", fireworks: 6 }
        };

        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            gameState.isPlaying = true;
            
            showCountdown(3, () => {
                startHongbaoRain();
                startTimer();
            });
        }

        function showCountdown(seconds, callback) {
            const cd = document.getElementById('countdown');
            cd.style.display = 'block';
            cd.textContent = seconds;
            
            const interval = setInterval(() => {
                seconds--;
                if (seconds > 0) {
                    cd.textContent = seconds;
                } else {
                    clearInterval(interval);
                    cd.style.display = 'none';
                    callback();
                }
            }, 1000);
        }

        function startHongbaoRain() {
            let batchCount = 0;
            const maxBatches = 15;
            
            gameState.hongbaoInterval = setInterval(() => {
                if (batchCount >= maxBatches) {
                    clearInterval(gameState.hongbaoInterval);
                    return;
                }
                
                const speedMultiplier = 1 + (batchCount * 0.1);
                const count = 2 + Math.floor(Math.random() * 3);
                
                for (let i = 0; i < count; i++) {
                    setTimeout(() => createHongbao(speedMultiplier), i * 150);
                }
                batchCount++;
            }, 1800);
        }

        function createHongbao(speedMultiplier = 1) {
            const wrapper = document.createElement('div');
            wrapper.className = 'hongbao-wrapper';
            
            if (Math.random() < 0.1) {
                wrapper.classList.add('gold');
            }
            
            wrapper.style.left = Math.random() * (window.innerWidth - 100) + 'px';
            const duration = (2.5 + Math.random() * 1.5) / speedMultiplier;
            wrapper.style.animationDuration = duration + 's';
            
            const hongbao = document.createElement('div');
            hongbao.className = 'hongbao';
            wrapper.appendChild(hongbao);
            
            wrapper.addEventListener('click', (e) => {
                e.stopPropagation();
                catchHongbao(wrapper);
            });
            
            wrapper.addEventListener('animationend', () => wrapper.remove());
            
            document.getElementById('gameContainer').appendChild(wrapper);
        }

        function catchHongbao(wrapper) {
            const isGold = wrapper.classList.contains('gold');
            const points = isGold ? 2 : 1;
            
            gameState.hongbaoCount += points;
            gameState.score += points * 10;
            updateDisplay();
            
            wrapper.style.transform = 'scale(1.3)';
            wrapper.style.opacity = '0';
            setTimeout(() => wrapper.remove(), 150);
        }

        function startTimer() {
            gameState.timerInterval = setInterval(() => {
                gameState.timeLeft--;
                updateDisplay();
                
                if (gameState.timeLeft <= 0) {
                    endHongbaoPhase();
                }
            }, 1000);
        }

        function endHongbaoPhase() {
            clearInterval(gameState.timerInterval);
            clearInterval(gameState.hongbaoInterval);
            gameState.isPlaying = false;
            
            document.querySelectorAll('.hongbao-wrapper').forEach(h => h.remove());
            startQuizPhase(5);
        }

        function startQuizPhase(count) {
            document.getElementById('quizScreen').style.display = 'block';
            
            // 根据红包数量选择难度
            let startIdx = 0;
            if (gameState.hongbaoCount >= 20) {
                startIdx = 60; // 困难
            } else if (gameState.hongbaoCount >= 10) {
                startIdx = 30; // 中等
            }
            
            gameState.selectedQuizzes = [];
            const available = [...quizzes];
            const difficultyPool = available.slice(startIdx, startIdx + 40);
            
            for (let i = 0; i < count; i++) {
                const pool = difficultyPool.length > 0 ? difficultyPool : available;
                const idx = Math.floor(Math.random() * pool.length);
                gameState.selectedQuizzes.push(pool[idx]);
                pool.splice(idx, 1);
            }
            
            gameState.currentQuiz = 0;
            gameState.correctQuizzes = 0;
            showQuiz();
        }

        function showQuiz() {
            if (gameState.currentQuiz >= gameState.selectedQuizzes.length) {
                endGame();
                return;
            }
            
            const q = gameState.selectedQuizzes[gameState.currentQuiz];
            document.getElementById('quizNumber').textContent = 
                `第 ${gameState.currentQuiz + 1} / ${gameState.selectedQuizzes.length} 题`;
            document.getElementById('answerType').textContent = q.type;
            document.getElementById('quizText').textContent = q.q;
            document.getElementById('answerInput').value = '';
            document.getElementById('quizResult').textContent = '';
            document.getElementById('quizResult').className = '';
            document.getElementById('hintBox').style.display = 'none';
            document.getElementById('hintText').textContent = '';
            document.getElementById('quizProgress').textContent = 
                `${gameState.currentQuiz}/${gameState.selectedQuizzes.length}`;
            
            startQuizTimer();
        }

        function startQuizTimer() {
            let timeLeft = 20;
            let hintShown = false;
            const q = gameState.selectedQuizzes[gameState.currentQuiz];
            
            clearInterval(gameState.quizTimer);
            
            gameState.quizTimer = setInterval(() => {
                timeLeft--;
                
                const progress = (timeLeft / 20) * 100;
                document.getElementById('timerProgress').style.width = progress + '%';
                
                // 10秒时显示引导提示
                if (timeLeft === 10 && !hintShown) {
                    hintShown = true;
                    document.getElementById('hintBox').style.display = 'block';
                    document.getElementById('hintText').textContent = q.hint;
                }
                
                if (timeLeft <= 0) {
                    clearInterval(gameState.quizTimer);
                    timeUp(q);
                }
            }, 1000);
        }

        function timeUp(q) {
            const resultDiv = document.getElementById('quizResult');
            resultDiv.textContent = `⏰ 时间到！答案是：${q.a}`;
            resultDiv.className = 'timeout';
            document.getElementById('hintBox').style.display = 'none';
            
            setTimeout(() => {
                gameState.currentQuiz++;
                showQuiz();
            }, 8000);
        }

        function checkAnswer() {
            const input = document.getElementById('answerInput').value.trim();
            if (!input) return;
            
            const q = gameState.selectedQuizzes[gameState.currentQuiz];
            const resultDiv = document.getElementById('quizResult');
            
            // 前10秒不显示错误提示
            const timeLeft = parseInt(document.getElementById('timerProgress').style.width) / 5;
            if (timeLeft > 10) {
                // 检查是否正确
                const correct = q.a.includes(input) || input.includes(q.a) || 
                               similarity(input, q.a) > 0.7;
                
                if (!correct) {
                    // 前10秒打错不提示，清空输入继续
                    document.getElementById('answerInput').value = '';
                    document.getElementById('answerInput').placeholder = '再想想...';
                    return;
                }
            }
            
            clearInterval(gameState.quizTimer);
            
            const correct = q.a.includes(input) || input.includes(q.a) || 
                           similarity(input, q.a) > 0.7;
            
            if (correct) {
                resultDiv.textContent = '🎉 回答正确！+50分';
                resultDiv.className = 'correct';
                gameState.correctQuizzes++;
                gameState.score += 50;
                updateDisplay();
                
                launchFireworks(3);
                
                setTimeout(() => {
                    gameState.currentQuiz++;
                    showQuiz();
                }, 3000);
            } else {
                resultDiv.textContent = '❌ 答案不对，继续思考...';
                resultDiv.className = 'wrong';
                document.getElementById('answerInput').value = '';
            }
        }

        function similarity(s1, s2) {
            s1 = s1.toLowerCase();
            s2 = s2.toLowerCase();
            if (s1 === s2) return 1;
            let match = 0;
            for (let c of s1) {
                if (s2.includes(c)) match++;
            }
            return match / Math.max(s1.length, s2.length);
        }

        function updateDisplay() {
            document.getElementById('hongbaoCount').textContent = gameState.hongbaoCount;
            document.getElementById('timeLeft').textContent = gameState.timeLeft;
            document.getElementById('score').textContent = gameState.score;
        }

        function endGame() {
            clearInterval(gameState.quizTimer);
            document.getElementById('quizScreen').style.display = 'none';
            document.getElementById('gameOver').style.display = 'flex';
            
            const finalScore = gameState.score + (gameState.correctQuizzes * 100);
            document.getElementById('finalScore').textContent = 
                `最终得分: ${finalScore} 分`;
            
            let rank = '';
            if (finalScore >= 600) rank = '🏆 知识大师';
            else if (finalScore >= 400) rank = '🥇 知识达人';
            else if (finalScore >= 200) rank = '🥈 知识学徒';
            else rank = '🥉 知识新手';
            
            document.getElementById('rank').textContent = 
                `抢到 ${gameState.hongbaoCount} 个红包，答对 ${gameState.correctQuizzes}/5 题\n${rank}`;
            
            const enc = encouragements[gameState.correctQuizzes] || encouragements[0];
            document.getElementById('encouragement').textContent = enc.text;
            
            setTimeout(() => launchFireworks(enc.fireworks), 500);
        }

        function launchFireworks(level = 3) {
            const canvas = document.getElementById('fireworksCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const configs = {
                1: { particles: 30, bursts: 1, colors: ['#4a9eff'] },
                2: { particles: 50, bursts: 2, colors: ['#4a9eff', '#6b5ce7'] },
                3: { particles: 80, bursts: 3, colors: ['#4a9eff', '#6b5ce7', '#ffd700'] },
                4: { particles: 120, bursts: 4, colors: ['#4a9eff', '#6b5ce7', '#ffd700', '#ff6b6b'] },
                5: { particles: 180, bursts: 5, colors: ['#4a9eff', '#6b5ce7', '#ffd700', '#ff6b6b', '#00ff00'] },
                6: { particles: 250, bursts: 6, colors: ['#4a9eff', '#6b5ce7', '#ffd700', '#ff6b6b', '#00ff00', '#ff00ff', '#00ffff', '#ffffff'] }
            };
            
            const config = configs[level] || configs[3];
            const allParticles = [];
            
            for (let b = 0; b < config.bursts; b++) {
                setTimeout(() => {
                    const centerX = (canvas.width / (config.bursts + 1)) * (b + 1);
                    const centerY = canvas.height / 2 + (Math.random() - 0.5) * 200;
                    
                    for (let i = 0; i < config.particles; i++) {
                        const angle = (Math.PI * 2 / config.particles) * i + Math.random() * 0.5;
                        const speed = 3 + Math.random() * 5;
                        allParticles.push({
                            x: centerX,
                            y: centerY,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed,
                            life: 1,
                            color: config.colors[Math.floor(Math.random() * config.colors.length)],
                            size: 2 + Math.random() * 3
                        });
                    }
                }, b * 300);
            }
            
            function animate() {
                ctx.fillStyle = 'rgba(10,10,26,0.08)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                let alive = false;
                allParticles.forEach(p => {
                    if (p.life > 0) {
                        alive = true;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.15;
                        p.vx *= 0.98;
                        p.life -= 0.015;
                        
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = p.life;
                        ctx.fill();
                        
                        ctx.beginPath();
                        ctx.arc(p.x - p.vx * 2, p.y - p.vy * 2, p.size * 0.5, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = p.life * 0.5;
                        ctx.fill();
                    }
                });
                
                if (alive) {
                    requestAnimationFrame(animate);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            
            animate();
        }

        document.getElementById('answerInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAnswer();
        });
    </script>
