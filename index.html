<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        #gameContainer {
            position: relative;
            width: 100%;
            min-height: 100vh;
        }
        
        /* 顶部信息栏 */
        #topBar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            border-bottom: 2px solid #ffd700;
        }
        
        .stat {
            color: #ffd700;
            font-size: 18px;
            font-weight: bold;
        }
        
        .stat span {
            color: #fff;
            margin-left: 5px;
        }
        
        /* 开始界面 */
        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        
        #startScreen h1 {
            color: #ffd700;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ffd700;
            animation: glow 2s ease-in-out infinite;
        }
        
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 20px #ffd700, 0 0 40px #ff6b6b; }
            50% { text-shadow: 0 0 30px #ffd700, 0 0 60px #ff6b6b; }
        }
        
        #startScreen p {
            color: #fff;
            font-size: 20px;
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.8;
        }
        
        .btn {
            padding: 15px 50px;
            font-size: 24px;
            background: linear-gradient(45deg, #ff6b6b, #ffd700);
            border: none;
            border-radius: 50px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(255,107,107,0.4);
        }
        
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(255,107,107,0.6);
        }
        
        /* 红包 - 增大点击区域 */
        .hongbao-wrapper {
            position: absolute;
            width: 100px;
            height: 120px;
            cursor: pointer;
            z-index: 100;
            animation: fall linear;
        }
        
        .hongbao {
            width: 60px;
            height: 80px;
            background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            box-shadow: 0 5px 15px rgba(255,0,0,0.4);
            margin: 20px auto;
        }
        
        .hongbao::before {
            content: "🧧";
        }
        
        .hongbao-wrapper.gold .hongbao {
            background: linear-gradient(135deg, #ffd700 0%, #ffaa00 100%);
            box-shadow: 0 5px 15px rgba(255,215,0,0.6);
        }
        
        @keyframes fall {
            from { transform: translateY(-150px) rotate(0deg); }
            to { transform: translateY(100vh) rotate(360deg); }
        }
        
        /* 灯谜界面 */
        #riddleScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1500;
            padding: 100px 20px 20px;
        }
        
        #riddleCard {
            max-width: 600px;
            margin: 0 auto;
            background: linear-gradient(135deg, #fff8dc 0%, #ffe4b5 100%);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(255,215,0,0.3);
            border: 3px solid #ffd700;
        }
        
        #riddleNumber {
            color: #cc0000;
            font-size: 18px;
            margin-bottom: 10px;
        }
        
        #riddleText {
            color: #333;
            font-size: 28px;
            line-height: 1.6;
            margin-bottom: 20px;
            text-align: center;
            min-height: 80px;
        }
        
        #timerBar {
            width: 100%;
            height: 10px;
            background: #ddd;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        #timerProgress {
            height: 100%;
            background: linear-gradient(90deg, #00aa00, #ffd700, #ff4444);
            width: 100%;
            transition: width 0.1s linear;
        }
        
        #answerInput {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            border: 2px solid #ffd700;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }
        
        #submitAnswer {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            background: linear-gradient(45deg, #ff6b6b, #ffd700);
            border: none;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
        }
        
        #riddleResult {
            margin-top: 15px;
            font-size: 20px;
            text-align: center;
            min-height: 60px;
        }
        
        #hint {
            color: #666;
            font-size: 16px;
            margin-top: 10px;
            text-align: center;
            font-style: italic;
        }
        
        .correct {
            color: #00aa00;
        }
        
        .wrong {
            color: #cc0000;
        }
        
        .timeout {
            color: #ff8800;
        }
        
        /* 烟花画布 */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3000;
        }
        
        /* 游戏结束界面 */
        #gameOver {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        #gameOver h2 {
            color: #ffd700;
            font-size: 48px;
            margin-bottom: 30px;
        }
        
        #finalScore {
            color: #fff;
            font-size: 36px;
            margin-bottom: 20px;
        }
        
        #rank {
            color: #ff6b6b;
            font-size: 28px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        
        #encouragement {
            color: #ffd700;
            font-size: 24px;
            margin-bottom: 40px;
            font-style: italic;
        }
        
        /* 倒计时 */
        #countdown {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            color: #ffd700;
            z-index: 2500;
            display: none;
            text-shadow: 0 0 30px #ffd700;
        }

</head>

            showCountdown(3, () => {
                startHongbaoRain();
                startTimer();
            });
        }

        // 显示倒计时
        function showCountdown(seconds, callback) {
            const cd = document.getElementById('countdown');
            cd.style.display = 'block';
            cd.textContent = seconds;
            
            const interval = setInterval(() => {
                seconds--;
                if (seconds > 0) {
                    cd.textContent = seconds;
                } else {
                    clearInterval(interval);
                    cd.style.display = 'none';
                    callback();
                }
            }, 1000);
        }

        // 红包雨 - 增大点击区域，加快掉落
        function startHongbaoRain() {
            let batchCount = 0;
            const maxBatches = 15;
            
            // 根据难度加快掉落速度
            const baseDuration = 3;
            
            gameState.hongbaoInterval = setInterval(() => {
                if (batchCount >= maxBatches) {
                    clearInterval(gameState.hongbaoInterval);
                    return;
                }
                
                // 难度递增：加快掉落速度
                const speedMultiplier = 1 + (batchCount * 0.1);
                const count = 2 + Math.floor(Math.random() * 3);
                
                for (let i = 0; i < count; i++) {
                    setTimeout(() => createHongbao(speedMultiplier), i * 150);
                }
                batchCount++;
            }, 1800);
        }

        // 创建红包 - 增大点击区域
        function createHongbao(speedMultiplier = 1) {
            const wrapper = document.createElement('div');
            wrapper.className = 'hongbao-wrapper';
            
            // 10%概率金色红包
            if (Math.random() < 0.1) {
                wrapper.classList.add('gold');
            }
            
            wrapper.style.left = Math.random() * (window.innerWidth - 100) + 'px';
            
            // 加快掉落速度
            const duration = (2.5 + Math.random() * 1.5) / speedMultiplier;
            wrapper.style.animationDuration = duration + 's';
            
            const hongbao = document.createElement('div');
            hongbao.className = 'hongbao';
            wrapper.appendChild(hongbao);
            
            // 点击事件 - 整个wrapper都可点击
            wrapper.addEventListener('click', (e) => {
                e.stopPropagation();
                catchHongbao(wrapper);
            });
            
            wrapper.addEventListener('animationend', () => wrapper.remove());
            
            document.getElementById('gameContainer').appendChild(wrapper);
        }

        // 抢到红包
        function catchHongbao(wrapper) {
            const isGold = wrapper.classList.contains('gold');
            const points = isGold ? 2 : 1;
            
            gameState.hongbaoCount += points;
            gameState.score += points * 10;
            updateDisplay();
            
            // 点击效果
            wrapper.style.transform = 'scale(1.3)';
            wrapper.style.opacity = '0';
            setTimeout(() => wrapper.remove(), 150);
        }

        // 计时器
        function startTimer() {
            gameState.timerInterval = setInterval(() => {
                gameState.timeLeft--;
                updateDisplay();
                
                if (gameState.timeLeft <= 0) {
                    endHongbaoPhase();
                }
            }, 1000);
        }

        // 结束抢红包阶段
        function endHongbaoPhase() {
            clearInterval(gameState.timerInterval);
            clearInterval(gameState.hongbaoInterval);
            gameState.isPlaying = false;
            
            document.querySelectorAll('.hongbao-wrapper').forEach(h => h.remove());
            
            // 固定5题
            startRiddlePhase(5);
        }

        // 灯谜阶段 - 每题20秒，10秒给提示
        function startRiddlePhase(count) {
            document.getElementById('riddleScreen').style.display = 'block';
            
            // 根据红包数量选择难度起始点
            let startIdx = 0;
            if (gameState.hongbaoCount >= 20) {
                startIdx = 65; // 困难
            } else if (gameState.hongbaoCount >= 10) {
                startIdx = 30; // 中等
            }
            
            // 随机选择5题
            gameState.selectedRiddles = [];
            const available = [...riddles];
            // 优先从对应难度选
            const difficultyPool = available.slice(startIdx, startIdx + 35);
            
            for (let i = 0; i < count; i++) {
                const pool = difficultyPool.length > 0 ? difficultyPool : available;
                const idx = Math.floor(Math.random() * pool.length);
                gameState.selectedRiddles.push(pool[idx]);
                pool.splice(idx, 1);
            }
            
            gameState.currentRiddle = 0;
            gameState.correctRiddles = 0;
            showRiddle();
        }

        // 显示灯谜 - 20秒倒计时
        function showRiddle() {
            if (gameState.currentRiddle >= gameState.selectedRiddles.length) {
                endGame();
                return;
            }
            
            const r = gameState.selectedRiddles[gameState.currentRiddle];
            document.getElementById('riddleNumber').textContent = 
                `第 ${gameState.currentRiddle + 1} / ${gameState.selectedRiddles.length} 题`;
            document.getElementById('riddleText').textContent = r.q;
            document.getElementById('answerInput').value = '';
            document.getElementById('riddleResult').textContent = '';
            document.getElementById('riddleResult').className = '';
            document.getElementById('hint').textContent = '';
            document.getElementById('riddleProgress').textContent = 
                `${gameState.currentRiddle}/${gameState.selectedRiddles.length}`;
            
            // 启动20秒倒计时
            startRiddleTimer();
        }

        // 灯谜倒计时 - 20秒，10秒给提示
        function startRiddleTimer() {
            let timeLeft = 20;
            let hintShown = false;
            const r = gameState.selectedRiddles[gameState.currentRiddle];
            
            clearInterval(gameState.riddleTimer);
            
            gameState.riddleTimer = setInterval(() => {
                timeLeft--;
                
                // 更新进度条
                const progress = (timeLeft / 20) * 100;
                document.getElementById('timerProgress').style.width = progress + '%';
                
                // 10秒时给提示
                if (timeLeft === 10 && !hintShown) {
                    hintShown = true;
                    document.getElementById('hint').textContent = `💡 提示：${r.hint}`;
                }
                
                // 时间到
                if (timeLeft <= 0) {
                    clearInterval(gameState.riddleTimer);
                    timeUp(r);
                }
            }, 1000);
        }

        // 时间到 - 显示答案，10秒后下一题
        function timeUp(r) {
            const resultDiv = document.getElementById('riddleResult');
            resultDiv.textContent = `⏰ 时间到！答案是：${r.a}`;
            resultDiv.className = 'timeout';
            document.getElementById('hint').textContent = '';
            
            // 10秒后自动下一题
            setTimeout(() => {
                gameState.currentRiddle++;
                showRiddle();
            }, 10000);
        }

        // 检查答案
        function checkAnswer() {
            const input = document.getElementById('answerInput').value.trim();
            if (!input) return;
            
            const r = gameState.selectedRiddles[gameState.currentRiddle];
            const resultDiv = document.getElementById('riddleResult');
            
            clearInterval(gameState.riddleTimer);
            
            // 模糊匹配
            const correct = r.a.includes(input) || input.includes(r.a) || 
                           similarity(input, r.a) > 0.7;
            
            if (correct) {
                resultDiv.textContent = '🎉 回答正确！+50分';
                resultDiv.className = 'correct';
                gameState.correctRiddles++;
                gameState.score += 50;
                updateDisplay();
                
                // 放烟花
                launchFireworks(3);
                
                // 3秒后下一题
                setTimeout(() => {
                    gameState.currentRiddle++;
                    showRiddle();
                }, 3000);
            } else {
                resultDiv.textContent = '❌ 答案不对，继续思考...';
                resultDiv.className = 'wrong';
                // 继续倒计时
                startRiddleTimer();
            }
        }

        // 字符串相似度
        function similarity(s1, s2) {
            s1 = s1.toLowerCase();
            s2 = s2.toLowerCase();
            if (s1 === s2) return 1;
            let match = 0;
            for (let c of s1) {
                if (s2.includes(c)) match++;
            }
            return match / Math.max(s1.length, s2.length);
        }

        // 更新显示
        function updateDisplay() {
            document.getElementById('hongbaoCount').textContent = gameState.hongbaoCount;
            document.getElementById('timeLeft').textContent = gameState.timeLeft;
            document.getElementById('score').textContent = gameState.score;
        }

        // 游戏结束 - 根据答对题数放不同烟花
        function endGame() {
            clearInterval(gameState.riddleTimer);
            document.getElementById('riddleScreen').style.display = 'none';
            document.getElementById('gameOver').style.display = 'flex';
            
            const finalScore = gameState.score + (gameState.correctRiddles * 100);
            document.getElementById('finalScore').textContent = 
                `最终得分: ${finalScore} 分`;
            
            // 排名
            let rank = '';
            if (finalScore >= 600) rank = '🏆 灯谜大师';
            else if (finalScore >= 400) rank = '🥇 猜谜高手';
            else if (finalScore >= 200) rank = '🥈 猜谜达人';
            else rank = '🥉 猜谜新手';
            
            document.getElementById('rank').textContent = 
                `抢到 ${gameState.hongbaoCount} 个红包，答对 ${gameState.correctRiddles}/5 道灯谜\n${rank}`;
            
            // 鼓励词
            const enc = encouragements[gameState.correctRiddles] || encouragements[0];
            document.getElementById('encouragement').textContent = enc.text;
            
            // 放对应等级的烟花
            setTimeout(() => launchFireworks(enc.fireworks), 500);
        }

        // 烟花效果 - 等级1-6
        function launchFireworks(level = 3) {
            const canvas = document.getElementById('fireworksCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // 根据等级设置参数
            const configs = {
                1: { particles: 30, bursts: 1, colors: ['#ff4444'] },
                2: { particles: 50, bursts: 2, colors: ['#ff4444', '#ffd700'] },
                3: { particles: 80, bursts: 3, colors: ['#ff6b6b', '#ffd700', '#ffaa00'] },
                4: { particles: 120, bursts: 4, colors: ['#ff6b6b', '#ffd700', '#ffaa00', '#ff4444'] },
                5: { particles: 180, bursts: 5, colors: ['#ff6b6b', '#ffd700', '#ffaa00', '#ff4444', '#ffff00'] },
                6: { particles: 250, bursts: 6, colors: ['#ff6b6b', '#ffd700', '#ffaa00', '#ff4444', '#ffff00', '#00ff00', '#00ffff', '#ff00ff'] }
            };
            
            const config = configs[level] || configs[3];
            const allParticles = [];
            
            // 创建多个爆炸点
            for (let b = 0; b < config.bursts; b++) {
                setTimeout(() => {
                    const centerX = (canvas.width / (config.bursts + 1)) * (b + 1);
                    const centerY = canvas.height / 2 + (Math.random() - 0.5) * 200;
                    
                    for (let i = 0; i < config.particles; i++) {
                        const angle = (Math.PI * 2 / config.particles) * i + Math.random() * 0.5;
                        const speed = 3 + Math.random() * 5;
                        allParticles.push({
                            x: centerX,
                            y: centerY,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed,
                            life: 1,
                            color: config.colors[Math.floor(Math.random() * config.colors.length)],
                            size: 2 + Math.random() * 3
                        });
                    }
                }, b * 300);
            }
            
            // 动画
            function animate() {
                ctx.fillStyle = 'rgba(0,0,0,0.08)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                let alive = false;
                allParticles.forEach(p => {
                    if (p.life > 0) {
                        alive = true;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.15; // 重力
                        p.vx *= 0.98; // 阻力
                        p.life -= 0.015;
                        
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = p.life;
                        ctx.fill();
                        
                        // 尾迹
                        ctx.beginPath();
                        ctx.arc(p.x - p.vx * 2, p.y - p.vy * 2, p.size * 0.5, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = p.life * 0.5;
                        ctx.fill();
                    }
                });
                
                if (alive) {
                    requestAnimationFrame(animate);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            
            animate();
        }

        // 回车提交
        document.getElementById('answerInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAnswer();
        });
    </script>
